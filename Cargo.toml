[package]
name = "focal"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
git2 = "0.20"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
pdf-extract = "0.10"
grep-regex = "0.1"
grep-searcher = "0.1"
html-to-markdown-rs = { version = "3.23", default-features = false }
ureq = { version = "3", features = ["brotli"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
nucleo-matcher = "0.3"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
clap_complete = "4.6.12"
sha2 = "0.11.1"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false }

# Smaller distributed binary. Keep panic = "unwind": the picker restores the terminal
# from a Drop guard while a panic unwinds. opt-level stays at 3: "z" is about 30% smaller
# but has not been measured on large PDF, web, or search inputs.
[profile.release]
strip = true
lto = true
codegen-units = 1
