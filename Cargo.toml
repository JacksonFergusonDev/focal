[package]
name = "focal"
version = "0.3.0"
edition = "2024"
description = "Extract clean, token-efficient codebase context, diffs, and CI logs for LLM workflows."
readme = "README.md"
license = "MIT"
authors = ["Jackson Ferguson <jackson.ferguson0@gmail.com>"]
repository = "https://github.com/JacksonFergusonDev/focal"
homepage = "https://github.com/JacksonFergusonDev/focal"
keywords = ["cli", "llm", "context", "git", "github"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
git2 = "0.20"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
pdf-extract = "0.10"
grep-regex = "0.1"
grep-searcher = "0.1"
html-to-markdown-rs = { version = "3.23", default-features = false }
ureq = { version = "3", features = ["brotli"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
nucleo-matcher = "0.3"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
clap_complete = "4.6.12"
sha2 = "0.11.1"
# Build OpenSSL (used by git2's HTTPS and SSH transports) from source and link it
# statically, so release binaries and manylinux wheels carry no system libssl dependency.
openssl-sys = { version = "0.9", features = ["vendored"] }
signal-hook = "0.3"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
tiny_http = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false }

# Smaller distributed binary. Keep panic = "unwind": the picker restores the terminal
# from a Drop guard while a panic unwinds. opt-level stays at 3: "z" is about 30% smaller
# but made PDF, web, and large-text extraction 1.5-2.4x slower in benchmarks.
[profile.release]
strip = true
lto = true
codegen-units = 1
