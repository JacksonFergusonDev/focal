[package]
name = "focal"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
git2 = "0.20"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
pdf-extract = "0.10"
grep-regex = "0.1"
grep-searcher = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false }
