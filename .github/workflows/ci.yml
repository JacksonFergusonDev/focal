name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.14"]

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    # 1. Linux Dependency Routing
    - name: Install System Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck shfmt bats fd-find tree ripgrep
        sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

    # 2. macOS Dependency Routing
    - name: Install System Dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install shellcheck shfmt bats-core fd tree ripgrep

    - name: Install html-to-markdown
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          TARGET="x86_64-unknown-linux-musl"
        elif [ "${{ runner.os }}" = "macOS" ]; then
          TARGET="aarch64-apple-darwin"
        fi
        curl -fsSL "https://github.com/xberg-io/html-to-markdown/releases/download/v3.12.2/cli-${TARGET}.tar.gz" | tar -xz
        sudo mv "cli-${TARGET}/html-to-markdown" /usr/local/bin/
        sudo chmod +x /usr/local/bin/html-to-markdown
        rm -rf "cli-${TARGET}"

    - name: Install uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --group ci

    - name: Lint with Ruff
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Type check with Mypy
      run: uv run mypy .

    - name: Run tests
      run: uv run pytest

    - name: Lint shell scripts with Shellcheck
      run: find bin libexec lib -maxdepth 1 -type f ! -name "*.json" -exec shellcheck --severity=warning {} +

    - name: Run Bash tests
      run: bats --print-output-on-failure tests/bash/

    - name: Lint Markdown
      uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23
      with:
        globs: '**/*.md'
