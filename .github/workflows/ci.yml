name: CI

on:
  push:
    branches: [ "main" ]
  # Run on PRs targeting any branch so stacked PRs are checked too.
  pull_request:
  # Lets the release workflow run the same checks before publishing.
  workflow_call:

permissions:
  contents: read

# Replace stale PR runs, and keep a separate run for each push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # All OS- and architecture-agnostic checks run on a single ARM Ubuntu runner.
  checks:
    name: Lint, Format & Security
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: checks-aarch64-unknown-linux-gnu
          cache-on-failure: true
          cache-all-crates: true

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Lint Markdown
        uses: rvben/rumdl@1e0f1d13c87418c31e0d59dacddd98f27a02efcc # v0.3.2
        with:
          version: "0.3.2"
          report-type: annotations

      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: "1.7.12"
          pyflakes: false

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          inputs: .github/
          token: ${{ github.token }}
          advanced-security: false
          annotations: true

  # Architecture-agnostic coverage check on ARM Ubuntu. The CLI contract tests run the
  # instrumented binary, so end-to-end behaviour counts toward the floor.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage-aarch64-unknown-linux-gnu
          cache-on-failure: true
          cache-all-crates: true

      - name: Run tests with coverage floor
        run: cargo llvm-cov --locked --all-targets --fail-under-lines 80

  # OS- and architecture-specific test matrix. Focal relies on Unix terminals and
  # file APIs, so Windows is not a supported platform.
  test:
    name: Test / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
          - platform: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - platform: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0-${{ matrix.target }}

      - name: Confirm native Rust architecture
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          rustc -vV
          test "$(rustc -vV | awk '/^host: / {print $2}' | tr -d '\r')" = "$EXPECTED_TARGET"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test-${{ matrix.target }}
          cache-on-failure: true
          cache-all-crates: true

      - name: Run unit and CLI contract tests
        run: cargo test --locked --all-targets --no-fail-fast

  # The release build with no developer tools on PATH, the way users run it.
  smoke:
    name: Smoke test the release binary
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0-aarch64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: smoke-aarch64-apple-darwin
          cache-on-failure: true
          cache-all-crates: true

      - name: Build release binary
        run: cargo build --locked --release

      - name: Check linked libraries
        run: |
          otool -L target/release/focal
          if otool -L target/release/focal | grep -E '/opt/homebrew|/usr/local|libssl|libcrypto'; then
            echo "::error::binary links a non-system library"
            exit 1
          fi

      - name: Run commands with an empty environment
        run: |
          focal="$PWD/target/release/focal"
          work="$(mktemp -d)"
          mkdir -p "$work/project/src"
          echo 'def main(): pass' > "$work/project/src/app.py"
          cd "$work/project"
          env -i HOME="$work" "$focal" --version
          env -i HOME="$work" "$focal" --commands | grep -qx wip-context
          env -i HOME="$work" "$focal" tree | grep -q 'app.py'
          env -i HOME="$work" "$focal" search 'def main' | grep -q 'app.py'
          env -i HOME="$work" "$focal" files --all | grep -q 'def main'
          "$focal" completions bash | bash -n
          "$focal" completions zsh | zsh -n
