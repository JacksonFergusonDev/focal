name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # 1. Linux Dependency Routing
    - name: Install System Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck shfmt bats fd-find tree ripgrep
        sudo ln -sf "$(which fdfind)" /usr/local/bin/fd

    # 2. macOS Dependency Routing
    - name: Install System Dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install shellcheck shfmt bats-core fd tree ripgrep

    - name: Install html-to-markdown
      run: |
        # Checksums are the published release asset digests; update them with the version.
        if [ "${{ runner.os }}" = "Linux" ]; then
          TARGET="x86_64-unknown-linux-musl"
          SHA256="45c5dab86315542b6847a00d5dc1b2541f8ccd8d817d061b4c263ac75765dd4c"
        elif [ "${{ runner.os }}" = "macOS" ]; then
          TARGET="aarch64-apple-darwin"
          SHA256="18d48d1473ca587e0f7726228bc51ba1a6355aab65038a58b0a3d4b0c8499940"
        fi
        ARCHIVE="cli-${TARGET}.tar.gz"
        curl -fsSLo "$ARCHIVE" "https://github.com/xberg-io/html-to-markdown/releases/download/v3.12.2/${ARCHIVE}"
        echo "${SHA256}  ${ARCHIVE}" | shasum -a 256 -c -
        tar -xzf "$ARCHIVE"
        sudo mv "cli-${TARGET}/html-to-markdown" /usr/local/bin/
        sudo chmod +x /usr/local/bin/html-to-markdown
        rm -rf "cli-${TARGET}" "$ARCHIVE"

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --group ci

    - name: Lint with Ruff
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Type check with Mypy
      run: uv run mypy .

    - name: Run tests
      run: uv run pytest

    - name: Lint shell scripts with Shellcheck
      run: find bin libexec lib -maxdepth 1 -type f ! -name "*.json" -exec shellcheck --severity=warning {} +

    - name: Run Bash tests
      run: bats --print-output-on-failure tests/bash/

    # macOS ships Bash 3.2 as /bin/bash; shadow 'bash' on PATH so bats and every
    # '#!/usr/bin/env bash' script run under it.
    - name: Run Bash tests under Bash 3.2
      if: runner.os == 'macOS' && matrix.python-version == '3.14'
      run: |
        mkdir -p "$RUNNER_TEMP/bash32"
        ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
        export PATH="$RUNNER_TEMP/bash32:$PATH"
        bash --version | head -n 1
        bats --print-output-on-failure tests/bash/

    - name: Lint Markdown
      uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
      with:
        globs: '**/*.md'
