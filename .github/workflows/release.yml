name: Release

# A version tag runs two independent paths:
# - sync-homebrew: the legacy path. The tap formula installs the Bash/Python layout from
#   the tag's source tarball and does not use the Rust archives.
# - build + publish: the Rust binary. Each target is built and smoke-tested on a native
#   runner, packaged with completions, README, and license, and attached with SHA-256
#   checksums to a *draft* GitHub release that a maintainer reviews and publishes.
# A manual run (workflow_dispatch) builds and uploads workflow artifacts only.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-homebrew:
    name: Delegate Homebrew Update
    if: github.event_name == 'push'
    uses: JacksonFergusonDev/ci-cd-release-infrastructure/.github/workflows/update-homebrew-local.yml@cff447baf1076b8807502ab8da7d2f0867a973fc # main
    with:
      tag: ${{ github.ref_name }}
      formula_path: "Formula/focal.rb"
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 11 is the oldest deployment target for both architectures.
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          # Building on Ubuntu 22.04 sets the glibc floor at 2.35.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # git2 pulls in openssl-sys; link it statically so the archive does not depend on
      # the runner's Homebrew OpenSSL (macOS) or libssl3 (Linux).
      OPENSSL_STATIC: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Determine version
      id: version
      run: |
        VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
        if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
          echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VERSION}"
          exit 1
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Install build dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

    - name: Locate OpenSSL (macOS)
      if: runner.os == 'macOS'
      run: echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

    - name: Install Rust
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        rustup toolchain install stable --profile minimal --no-self-update
        rustup default stable
        rustup target add "${{ matrix.target }}"
        rustc --version

    - name: Build
      run: cargo build --locked --release --target "${{ matrix.target }}"

    - name: Inspect native dependencies
      run: |
        BIN="target/${{ matrix.target }}/release/focal"
        ls -l "$BIN"
        if [ "${{ runner.os }}" = "macOS" ]; then
          otool -L "$BIN"
          if otool -L "$BIN" | grep -E '/opt/homebrew|/usr/local|libssl|libcrypto'; then
            echo "::error::binary links a non-system library"
            exit 1
          fi
          otool -l "$BIN" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX'
        else
          ldd "$BIN"
          if ldd "$BIN" | grep -E 'libssl|libcrypto'; then
            echo "::error::binary links OpenSSL dynamically"
            exit 1
          fi
          echo "Highest glibc symbol version:"
          objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
        fi

    - name: Package
      id: package
      run: |
        NAME="focal-${{ steps.version.outputs.version }}-${{ matrix.target }}"
        BIN="target/${{ matrix.target }}/release/focal"
        mkdir -p "dist/${NAME}/completions"
        cp "$BIN" README.md LICENSE "dist/${NAME}/"
        "$BIN" completions bash > "dist/${NAME}/completions/focal.bash"
        "$BIN" completions zsh > "dist/${NAME}/completions/_focal"
        tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
        (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
        echo "name=${NAME}" >> "$GITHUB_OUTPUT"

    # Runs the packaged binary from outside the checkout, with no tools on PATH.
    - name: Smoke test the archive
      run: |
        WORK="$(mktemp -d)"
        tar -C "$WORK" -xzf "dist/${{ steps.package.outputs.name }}.tar.gz"
        FOCAL="$WORK/${{ steps.package.outputs.name }}/focal"
        bash -n "$WORK/${{ steps.package.outputs.name }}/completions/focal.bash"
        if command -v zsh >/dev/null 2>&1; then
          zsh -n "$WORK/${{ steps.package.outputs.name }}/completions/_focal"
        fi
        mkdir -p "$WORK/project/src"
        echo 'def main(): pass' > "$WORK/project/src/app.py"
        cd "$WORK/project"
        env -i HOME="$WORK" "$FOCAL" --commands | grep -qx wip-context
        env -i HOME="$WORK" "$FOCAL" tree | tee /dev/stderr | grep -q 'app.py'
        env -i HOME="$WORK" "$FOCAL" search 'def main' | grep -q 'app.py'

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.package.outputs.name }}
        path: |
          dist/${{ steps.package.outputs.name }}.tar.gz
          dist/${{ steps.package.outputs.name }}.tar.gz.sha256
        if-no-files-found: error

  publish:
    name: Draft GitHub release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        merge-multiple: true

    - name: Write checksums
      working-directory: dist
      run: |
        cat ./*.tar.gz.sha256 > SHA256SUMS
        shasum -a 256 -c SHA256SUMS
        cat SHA256SUMS

    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: |
        gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes \
          dist/*.tar.gz dist/SHA256SUMS
