[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "focalcli"
dynamic = ["version"]
description = "Extract clean, token-efficient codebase context, diffs, and CI logs for LLM workflows."
readme = "README.md"
authors = [{ name = "Jackson Ferguson", email = "jackson.ferguson0@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development",
]

[project.urls]
Repository = "https://github.com/JacksonFergusonDev/focal"
Issues = "https://github.com/JacksonFergusonDev/focal/issues"
PyPI = "https://pypi.org/project/focalcli/"
Author = "https://jacksonferguson.me"

[tool.maturin]
bindings = "bin"
strip = true
